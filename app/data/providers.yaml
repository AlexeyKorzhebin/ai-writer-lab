providers:
  - key: openai
    name: OpenAI
    base_url: https://api.openai.com/v1
    models:
      - gpt-4o
      - gpt-4o-mini
      - gpt-4-turbo
      - gpt-3.5-turbo

  - key: caila
    name: CAILA (Just AI)
    base_url: https://caila.io/api/adapters/openai
    models:
      - just-ai/openai-proxy/gpt-4o
      - just-ai/openai-proxy/gpt-4o-mini
      - just-ai/openai-proxy/gpt-3.5-turbo

  - key: ollama
    name: Ollama (Local)
    base_url: http://localhost:11434/v1
    models:
      - llama3.1
      - llama3.1:70b
      - mistral
      - mixtral
      - qwen2.5

  - key: custom
    name: Custom Provider
    base_url: ""
    models: []
