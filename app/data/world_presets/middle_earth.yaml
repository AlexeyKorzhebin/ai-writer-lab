name: Средиземье (Толкиен)
world_type: fantasy
time_period: Третья Эпоха
atmosphere: Эпическая, мифологическая, с ощущением уходящей эпохи
rules: >
  Магия существует, но редка и связана с Древними Силами.
  Кольца Власти — источники могущества. Бессмертные эльфы уходят на Запад.
geography_overview: >
  Обширный континент от Шира на западе до Мордора на востоке.
  Мглистые горы разделяют запад и восток.
technology_level: Средневековый с элементами магии
races: Люди, Эльфы, Гномы, Хоббиты, Орки, Энты
locations:
  - name: Шир
    location_type: region
    description: Мирная зелёная страна хоббитов с холмами, садами и норами
    atmosphere: Идиллическая, домашняя, уютная
  - name: Ривенделл
    location_type: city
    description: Последний Домашний Приют, скрытая долина эльфов
    atmosphere: Мудрость, покой, вечная красота
  - name: Мория
    location_type: building
    description: Древние подземные чертоги гномов, ныне занятые тьмой
    atmosphere: Величие прошлого, мрак, опасность
  - name: Мордор
    location_type: region
    description: Тёмная земля Саурона, окружённая горами
    atmosphere: Зловещая, безнадёжная, удушающая
