atmosphere: Неон, дождь, корпоративная антиутопия, высокие технологии и низкая жизнь
rules: >
  Корпорации сильнее государств. Кибернетические имплантаты доступны всем.
  ИИ контролирует инфраструктуру. Сеть — второй мир.
geography_overview: Мегаполисы-ульи, разделённые на ярусы по уровню благосостояния
technology_level: Кибернетика, ИИ, голографика, антигравитация
