  - name: Нижний Город
    location_type: region
    description: Вечная тень под мегаструктурами, неоновые вывески и рынки
    atmosphere: Хаотичная, живая, опасная
  - name: Сеть
    location_type: natural
    description: Виртуальное пространство данных, визуализированное как бесконечный город
