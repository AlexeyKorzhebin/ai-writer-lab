<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Writer Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-2">AI Writer Lab</h1>
    <p class="text-gray-500 mb-8">Multi-agent writing studio for long-form content</p>

    <div class="bg-white shadow rounded-lg p-6 mb-8">
        <h2 class="text-lg font-semibold mb-3">Create New Project</h2>

        <div class="space-y-3">
            <input id="project-title" class="w-full border rounded p-2" placeholder="Project title" />
            <textarea id="project-description" class="w-full border rounded p-2" rows="2" placeholder="Project description"></textarea>
            <div class="grid grid-cols-2 gap-3">
                <input id="project-author" class="w-full border rounded p-2" placeholder="Author name" />
                <textarea id="project-style" class="w-full border rounded p-2" rows="1" placeholder="Author style / tone"></textarea>
            </div>
            <div class="flex gap-3">
                <button onclick="createProject(false)" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Create Project
                </button>
                <button onclick="createProject(true)" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
                    Create Story (Wizard)
                </button>
            </div>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-lg font-semibold mb-3">Projects</h2>

        <ul class="space-y-2">
            {% for project in projects %}
                <li class="flex items-center justify-between p-2 hover:bg-gray-50 rounded">
                    <a class="text-blue-600 font-medium" href="projects/{{ project.id }}">
                        {{ project.title }}
                    </a>
                    <a href="projects/{{ project.id }}/story/workspace"
                       class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-200">
                        Story Workspace
                    </a>
                </li>
            {% else %}
                <li class="text-gray-500">No projects yet.</li>
            {% endfor %}
        </ul>
    </div>

    <script>
        async function createProject(withWizard) {
            const title = document.getElementById('project-title').value;
            const description = document.getElementById('project-description').value;
            const author_name = document.getElementById('project-author').value;
            const author_style = document.getElementById('project-style').value;

            const response = await fetch('projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, author_name, author_style })
            });

            const data = await response.json();

            if (withWizard) {
                window.location.href = 'projects/' + data.id + '/story/wizard';
            } else {
                window.location.href = 'projects/' + data.id;
            }
        }
    </script>
</div>

</body>
</html>
