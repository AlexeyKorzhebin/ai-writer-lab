<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Writer Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl md:text-3xl font-bold mb-6">AI Writer Lab ✦</h1>

    <div class="bg-white shadow rounded-lg p-6 mb-8">
        <h2 class="text-lg font-semibold mb-3">Create New Project</h2>

        <div class="space-y-3">
            <input id="project-title" class="w-full border rounded p-2" placeholder="Project title" />
            <textarea id="project-description" class="w-full border rounded p-2" rows="3" placeholder="Project description"></textarea>
            <button onclick="createProject()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
                Create Project
            </button>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-lg font-semibold mb-3">Existing Projects</h2>

        <ul class="space-y-2">
            {% for project in projects %}
                <li>
                    <a class="text-blue-600" href="projects/{{ project.id }}">
                        {{ project.title }}
                    </a>
                </li>
            {% else %}
                <li class="text-gray-500">No projects yet.</li>
            {% endfor %}
        </ul>
    </div>

    <script>
        async function createProject() {
            const title = document.getElementById('project-title').value;
            const description = document.getElementById('project-description').value;

            const response = await fetch('projects', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title, description })
            });

            const data = await response.json();
            window.location.href = 'projects/' + data.id;
        }
    </script>
</div>

</body>
</html>
