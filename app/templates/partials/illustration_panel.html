<!-- Illustration Prompt Generator — Sliding panel -->
<div x-data="illustrationPanel({{ project.id }})" x-show="open" x-cloak
     class="fixed inset-0 z-50 flex justify-end" @keydown.escape.window="open = false">

  <div class="absolute inset-0 bg-black/40" @click="open = false"></div>

  <div class="relative w-[480px] h-full flex flex-col shadow-xl"
       style="background:var(--bg-primary)"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="translate-x-full"
       x-transition:enter-end="translate-x-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="translate-x-0"
       x-transition:leave-end="translate-x-full">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b" style="border-color:var(--border-color)">
      <h3 class="font-semibold flex items-center gap-2">
        <i data-lucide="image" class="w-5 h-5" style="color:var(--accent)"></i> Иллюстрация
      </h3>
      <button @click="open = false" class="p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <!-- Step 1: Generate variants -->
      <div>
        <button @click="generateVariants()" :disabled="loading"
                class="btn-primary w-full py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Сгенерировать варианты
        </button>
      </div>

      <!-- Variants -->
      <template x-if="variants.length > 0">
        <div class="space-y-2">
          <p class="text-sm font-medium">Выберите вариант:</p>
          <template x-for="(v, i) in variants" :key="i">
            <button @click="selectedVariant = v"
                    class="w-full text-left p-3 rounded-lg border text-sm transition-all"
                    :class="selectedVariant === v ? 'border-indigo-500 bg-indigo-50 dark:bg-indigo-900/20' : ''"
                    :style="selectedVariant !== v ? 'border-color:var(--border-color)' : ''">
              <span class="font-medium" x-text="v.variant || `Вариант ${i + 1}`"></span>
              <p class="text-xs mt-1" style="color:var(--text-secondary)" x-text="v.composition"></p>
              <p class="text-xs" style="color:var(--text-muted)" x-text="v.lighting"></p>
            </button>
          </template>
          <div>
            <p class="text-xs font-medium mb-1" style="color:var(--text-secondary)">Или свой вариант:</p>
            <textarea x-model="customDesc" rows="2" class="input-field w-full rounded-lg px-3 py-2 text-sm"
                      placeholder="Опишите свой вариант..."></textarea>
          </div>
        </div>
      </template>

      <!-- Template selection -->
      <div>
        <label class="block text-sm font-medium mb-1">Шаблон стиля</label>
        <select x-model="selectedTemplate" class="input-field w-full rounded-lg px-3 py-2 text-sm">
          <template x-for="t in templates" :key="t.key">
            <option :value="t.key" x-text="t.name"></option>
          </template>
        </select>
      </div>

      <!-- Generate prompt -->
      <button @click="generatePrompt()" :disabled="loading"
              class="btn-primary w-full py-2 rounded-lg text-sm font-medium">
        Сгенерировать промпт
      </button>

      <!-- Result -->
      <template x-if="generatedPrompt">
        <div>
          <p class="text-sm font-medium mb-1">Промпт:</p>
          <div class="p-3 rounded-lg text-xs break-words" style="background:var(--bg-tertiary)"
               x-text="generatedPrompt"></div>
          <div class="flex gap-2 mt-2">
            <button @click="copyPrompt()" class="btn-secondary flex-1 py-1.5 rounded-lg text-xs flex items-center justify-center gap-1">
              <i data-lucide="copy" class="w-3 h-3"></i> Копировать
            </button>
            <button @click="uploadImage()" class="btn-secondary flex-1 py-1.5 rounded-lg text-xs flex items-center justify-center gap-1">
              <i data-lucide="upload" class="w-3 h-3"></i> Загрузить изображение
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
