<!-- Scene tree — included in story_workspace.html left panel -->
<div x-data="sceneTree({{ project.id }}, {{ spec_scenes_plain | tojson }})" class="flex min-h-0 flex-1 flex-col">

  <!-- Header -->
  <div class="flex items-center justify-between px-3 py-2 border-b" style="border-color:var(--border-color)">
    <span class="text-sm font-semibold flex items-center gap-1.5">
      <i data-lucide="list-tree" class="w-4 h-4"></i> Сцены
    </span>
    <button @click="addScene()" class="p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700" title="Добавить сцену">
      <i data-lucide="plus" class="w-4 h-4" style="color:var(--accent)"></i>
    </button>
  </div>

  <!-- Scene list -->
  <div x-ref="treeList" class="flex-1 overflow-y-auto py-1">
    <template x-for="(scene, idx) in scenes" :key="idx">
      <div @click="selectScene(idx)"
           class="flex items-center gap-2 px-3 py-2 cursor-pointer text-sm transition-colors"
           :class="selectedIdx === idx ? 'bg-indigo-50 dark:bg-indigo-900/20' : 'hover:bg-gray-50 dark:hover:bg-gray-800'">
        <!-- Drag handle -->
        <span class="drag-handle cursor-grab opacity-30 hover:opacity-70">
          <i data-lucide="grip-vertical" class="w-3 h-3"></i>
        </span>
        <!-- Status dot -->
        <span class="status-dot" :class="getStatusClass(scene)"></span>
        <!-- Title -->
        <span class="flex-1 truncate" x-text="scene.title || `Сцена ${idx + 1}`"></span>
        <!-- Word count -->
        <span class="text-xs tabular-nums" style="color:var(--text-muted)" x-text="wordCount(scene) + ' сл.'"></span>
      </div>
    </template>

    <template x-if="scenes.length === 0">
      <div class="px-3 py-6 text-center text-sm" style="color:var(--text-muted)">
        <p>Нет сцен</p>
        <button @click="addScene()" class="mt-2 text-xs btn-primary px-3 py-1 rounded-lg">Добавить первую</button>
      </div>
    </template>
  </div>

  <!-- Footer: stats -->
  <div class="px-3 py-2 border-t text-xs flex items-center justify-between" style="border-color:var(--border-color);color:var(--text-muted)">
    <span x-text="`${scenes.length} сцен`"></span>
    <span x-text="`${scenes.reduce((sum, s) => sum + (s.content ? s.content.split(/\\s+/).filter(Boolean).length : 0), 0)} слов`"></span>
  </div>
</div>
