<!-- AI Chat Panel — included in story_workspace.html right panel -->
<div x-data="chatPanel({{ project.id }})" class="flex min-h-0 flex-1 flex-col">

  <!-- Task bar -->
  <div class="flex items-center justify-between px-3 py-2 border-b" style="border-color:var(--border-color)">
    <div class="flex items-center gap-2">
      <i data-lucide="bot" class="w-4 h-4" style="color:var(--accent)"></i>
      <span class="text-sm font-medium" x-text="taskName"></span>
    </div>
    <div class="flex items-center gap-1">
      <button @click="newTask()" class="p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700" title="Новая задача">
        <i data-lucide="plus" class="w-4 h-4" style="color:var(--text-muted)"></i>
      </button>
    </div>
  </div>

  <!-- Context budget bar -->
  {% include "partials/context_bar.html" %}

  <!-- Messages -->
  <div x-ref="chatMessages" class="flex-1 overflow-y-auto px-3 py-3 space-y-3">
    <template x-if="messages.length === 0">
      <div class="text-center py-8" style="color:var(--text-muted)">
        <i data-lucide="message-circle" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
        <p class="text-sm">Начните диалог с AI-соавтором</p>
      </div>
    </template>

    <template x-for="(msg, i) in messages" :key="i">
      <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
        <div class="max-w-[85%] rounded-xl px-3 py-2 text-sm"
             :class="msg.role === 'user'
               ? 'bg-indigo-600 text-white rounded-br-sm'
               : 'rounded-bl-sm'"
             :style="msg.role !== 'user' ? 'background:var(--bg-tertiary);color:var(--text-primary)' : ''">
          <div x-html="formatMessage(msg.content)"></div>
          <!-- Apply actions for assistant messages -->
          <template x-if="msg.role === 'assistant' && msg.content">
            <div class="flex items-center gap-1 mt-2 pt-1 border-t border-white/10"
                 :style="msg.role !== 'user' ? 'border-color:var(--border-color)' : ''">
              <button @click="applyToEditor(msg.content, 'replace')"
                      class="text-xs opacity-70 hover:opacity-100 px-1.5 py-0.5 rounded" title="Заменить">
                <i data-lucide="replace" class="w-3 h-3 inline"></i>
              </button>
              <button @click="applyToEditor(msg.content, 'insert')"
                      class="text-xs opacity-70 hover:opacity-100 px-1.5 py-0.5 rounded" title="Вставить">
                <i data-lucide="text-cursor-input" class="w-3 h-3 inline"></i>
              </button>
              <button @click="copyToClipboard(msg.content)"
                      class="text-xs opacity-70 hover:opacity-100 px-1.5 py-0.5 rounded" title="Копировать">
                <i data-lucide="copy" class="w-3 h-3 inline"></i>
              </button>
            </div>
          </template>
        </div>
      </div>
    </template>

    <template x-if="loading">
      <div class="flex justify-start">
        <div class="rounded-xl px-3 py-2" style="background:var(--bg-tertiary)">
          <div class="flex gap-1">
            <div class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay:0ms"></div>
            <div class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay:150ms"></div>
            <div class="w-2 h-2 rounded-full bg-gray-400 animate-bounce" style="animation-delay:300ms"></div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Quick actions -->
  <div class="px-3 py-2 border-t flex flex-wrap gap-1" style="border-color:var(--border-color)">
    <button @click="quickAction('generate')" class="text-xs px-2 py-1 rounded-full btn-secondary">Генерация</button>
    <button @click="quickAction('continue')" class="text-xs px-2 py-1 rounded-full btn-secondary">Продолжить</button>
    <button @click="quickAction('dialogue')" class="text-xs px-2 py-1 rounded-full btn-secondary">Диалог</button>
    <button @click="quickAction('setting')" class="text-xs px-2 py-1 rounded-full btn-secondary">Описание</button>
    <button @click="quickAction('review')" class="text-xs px-2 py-1 rounded-full btn-secondary">Ревью</button>
  </div>

  <!-- Input -->
  <div class="px-3 py-3 border-t relative" style="border-color:var(--border-color)">
    <!-- @-autocomplete dropdown -->
    <div x-show="showRefs" class="absolute bottom-full left-3 right-3 mb-1 rounded-lg shadow-lg py-1 max-h-48 overflow-y-auto z-20"
         style="background:var(--bg-primary);border:1px solid var(--border-color)">
      <template x-for="ref in filteredRefs" :key="ref.type">
        <button @click="insertRef(ref)"
                class="block w-full text-left px-3 py-1.5 text-sm hover:bg-gray-100 dark:hover:bg-gray-700">
          <span class="font-medium" x-text="ref.prefix"></span>
          <span class="ml-2 opacity-60" x-text="ref.label"></span>
        </button>
      </template>
    </div>

    <div class="flex gap-2">
      <textarea x-ref="chatInput" x-model="input"
                @input="onInput($event)"
                @keydown.enter.prevent="if (!$event.shiftKey) send()"
                @keydown.escape="showRefs = false"
                rows="2" class="input-field flex-1 rounded-lg px-3 py-2 text-sm resize-none"
                placeholder="Напишите сообщение... (@ для ссылок)"
                :disabled="loading"></textarea>
      <button @click="send()" :disabled="loading || !input.trim()"
              class="btn-primary px-3 py-2 rounded-lg self-end disabled:opacity-50">
        <i data-lucide="send" class="w-4 h-4"></i>
      </button>
    </div>
  </div>
</div>
