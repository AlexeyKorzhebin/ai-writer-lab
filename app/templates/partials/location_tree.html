<!-- Location Tree — included in story_workspace.html left panel below scenes -->
<div x-data="{ locations: [], showAddModal: false, editLoc: null }" x-init="
  try { locations = await (await fetch(`/projects/{{ project.id }}/locations`)).json(); } catch(_) {}
">
  <div class="flex items-center justify-between px-3 py-2 border-t" style="border-color:var(--border-color)">
    <span class="text-sm font-semibold flex items-center gap-1.5">
      <i data-lucide="map-pin" class="w-4 h-4"></i> Локации
    </span>
    <button @click="showAddModal = true" class="p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-700" title="Добавить локацию">
      <i data-lucide="plus" class="w-4 h-4" style="color:var(--accent)"></i>
    </button>
  </div>

  <div class="px-2 pb-2 max-h-48 overflow-y-auto">
    <template x-for="loc in locations" :key="loc.id">
      <div class="flex items-center gap-2 px-2 py-1.5 rounded text-sm cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800">
        <i data-lucide="map-pin" class="w-3 h-3 flex-shrink-0" style="color:var(--text-muted)"></i>
        <span class="flex-1 truncate" x-text="loc.name"></span>
        <span class="text-xs px-1.5 py-0.5 rounded" style="background:var(--bg-tertiary);color:var(--text-muted)" x-text="loc.location_type"></span>
      </div>
    </template>
    <template x-if="locations.length === 0">
      <p class="text-xs text-center py-2" style="color:var(--text-muted)">Нет локаций</p>
    </template>
  </div>

  <!-- Add location modal -->
  <template x-if="showAddModal">
    <div class="dialog-overlay" @click.self="showAddModal = false">
      <div class="dialog-box">
        <h3 class="text-lg font-semibold mb-3">Новая локация</h3>
        <div class="space-y-3" x-data="{ name: '', type: 'building', desc: '' }">
          <input x-model="name" class="input-field w-full rounded-lg px-3 py-2 text-sm" placeholder="Название">
          <select x-model="type" class="input-field w-full rounded-lg px-3 py-2 text-sm">
            <option value="region">Регион</option>
            <option value="city">Город</option>
            <option value="building">Здание</option>
            <option value="room">Комната</option>
            <option value="natural">Природный объект</option>
            <option value="road">Путь/Дорога</option>
          </select>
          <textarea x-model="desc" rows="3" class="input-field w-full rounded-lg px-3 py-2 text-sm" placeholder="Описание"></textarea>
          <div class="flex justify-end gap-2">
            <button @click="showAddModal = false" class="btn-secondary px-4 py-2 rounded-lg text-sm">Отмена</button>
            <button @click="
              api('/projects/{{ project.id }}/locations', { method: 'POST', body: { name, location_type: type, description: desc } })
                .then(r => { locations.push({ id: r.id, name, location_type: type, description: desc }); showAddModal = false; Toast.success('Локация создана'); })
                .catch(e => Toast.error(e.message))
            " class="btn-primary px-4 py-2 rounded-lg text-sm">Создать</button>
          </div>
        </div>
      </div>
    </div>
  </template>
</div>
