<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ project.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<div class="max-w-4xl mx-auto px-4 py-8">
    <a href="../" class="text-blue-600">← Back to projects</a>

    <h1 class="text-2xl font-bold mt-4 mb-2">{{ project.title }}</h1>
    <p class="text-gray-600 mb-6">{{ project.description }}</p>

    <div class="flex justify-between items-center mb-3">
        <h2 class="text-xl font-semibold">Chapters</h2>
        <button onclick="generateOutline()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
            Generate Outline
        </button>
    </div>

    <div class="bg-white shadow rounded-lg p-4 mb-6">
        <h3 class="font-semibold mb-2">Add Chapter</h3>
        <input id="chapter-title" class="w-full border rounded p-2 mb-2" placeholder="Chapter title" />
        <button onclick="addChapter()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
            Add Chapter
        </button>
    </div>

    <ul class="space-y-2">
        {% for chapter in chapters %}
            <li class="bg-white p-3 rounded shadow">
                <div class="flex justify-between items-center">
                    <div class="font-semibold">{{ chapter.title }}</div>
                    <button onclick="generateChapter({{ chapter.id }})" class="bg-purple-600 text-white px-3 py-1 rounded text-sm hover:bg-purple-700">
                        Generate
                    </button>
                </div>
                <div class="text-sm text-gray-600 mt-2">{{ chapter.content[:300] if chapter.content else 'No content yet' }}</div>
            </li>
        {% else %}
            <li class="text-gray-500">No chapters yet.</li>
        {% endfor %}
    </ul>

    <script>
        async function addChapter() {
            const title = document.getElementById('chapter-title').value;

            await fetch('../projects/{{ project.id }}/chapters', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title })
            });

            window.location.reload();
        }

        async function generateChapter(chapterId) {
            await fetch('../projects/{{ project.id }}/generate-chapter/' + chapterId, {
                method: 'POST'
            });

            window.location.reload();
        }

        async function generateOutline() {
            await fetch('../projects/{{ project.id }}/generate-outline', {
                method: 'POST'
            });

            window.location.reload();
        }
    </script>
</div>

</body>
</html>
