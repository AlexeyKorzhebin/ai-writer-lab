[project]
name = "ai-writer-lab"
version = "0.1.0"
description = "Research-grade AI Writer Lab prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "openai",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "python-dotenv",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true
