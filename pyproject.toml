[project]
name = "ai-writer-lab"
version = "0.3.0"
description = "AI-powered multi-agent writing studio for long-form content production"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "jinja2>=3.1,<4",
    "openai>=1.60,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.28,<1",
    "ebooklib>=0.18,<1",
    "reportlab>=4.2,<5",
    "python-docx>=1.1,<2",
    "alembic>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
